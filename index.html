// face warping
let mood = 0, moodV = 0, moodTarget = 0, jiggle = 0, time = 0;
const G = (x, y, cx, cy, r) => { const dx = x - cx, dy = y - cy; return Math.exp(-(dx*dx + dy*dy) / (r*r)); };
const warpOut = [0, 0];
function warp(x, y) {
  const S = Math.max(mood, 0), D = Math.max(-mood, 0);
  let dx = 0, dy = 0, g;
  for (let s = -1; s <= 1; s += 2) {
    g = G(x, y, CX + s*MOUTH_DX, MOUTH_Y, 0.07);  dy += g*(0.06*S - 0.055*D); dx += g*s*0.02*S;
    g = G(x, y, CX + s*CHEEK_DX, CHEEK_Y, 0.08);  dy += g*(0.03*S - 0.012*D);
    g = G(x, y, CX + s*EYE_DX, EYE_Y - 0.04, 0.035); dy += g*0.018*S;
    g = G(x, y, CX + s*BROW_DX, BROW_Y, 0.045);   dy += g*(0.038*D + 0.012*S); dx -= g*s*0.008*D;
    g = G(x, y, CX + s*(BROW_DX + 0.08), BROW_Y, 0.05); dy -= g*0.014*D;
  }
  g = G(x, y, CX, -0.235, 0.065); dy += g*(-0.018*D + Math.sin(time*47)*0.0035*D); // chin wobble
  if (jiggle > 0.001) { g = G(x, y, CX, 0, 0.4); dy += g*Math.sin(time*41)*0.012*jiggle; dx += g*Math.sin(time*29)*0.008*jiggle; }
  for (const e of EARS) {
    const ex = x - e.ax, ey = y - e.ay, q2 = ex*ex/0.02 + ey*ey/0.035;
    if (q2 > 9) continue;
    const q = ex*ex/0.0072 + ey*ey/0.017, w = Math.exp(-q), w2 = Math.exp(-q2);
    const side = Math.min(1, Math.max(0, e.sgn*ex/0.03 + 0.5));
    const out = Math.min(1.2, Math.max(0, e.sgn*ex/0.2 + 0.6));
    const k = (EAR_BIG + e.s)*w*side;
    dx += ex*k + e.ox*w2*out; dy += ey*k + e.oy*w2*out;
  }
  warpOut[0] = dx; warpOut[1] = dy; return warpOut;
}

// ears
const EAR_BIG = 1.1;
const EARS = [
  {sgn: -1, ax: -0.219, ay: 0.07, cx: -0.29, cy: 0.07},
  {sgn:  1, ax:  0.258, ay: 0.075, cx: 0.32, cy: 0.078},
].map(e => Object.assign(e, {ox: 0, oy: 0, vx: 0, vy: 0, s: 0, vs: 0, held: false, gx: 0, gy: 0}));
let heldEar = null;
function earKick(power) { for (const e of EARS) { e.vx += e.sgn*rnd(0.2, 0.6)*power; e.vy += rnd(-0.5, 0.5)*power; e.vs += rnd(0.5, 2)*power; } }
function updateEars(dt) {
  for (const e of EARS) {
    if (e.held) {
      let tx = ptr.x - e.gx, ty = ptr.y - e.gy;
      const l = Math.hypot(tx, ty); if (l > 0.12) { tx *= 0.12/l; ty *= 0.12/l; }
      e.vx = (tx - e.ox)/dt; e.vy = (ty - e.oy)/dt; e.ox = tx; e.oy = ty;
    } else {
      e.vx += (-150*e.ox - 3*e.vx)*dt; e.vy += (-150*(e.oy - 0.015*mood) - 3*e.vy)*dt;
      e.ox += e.vx*dt; e.oy += e.vy*dt;
    }
    e.vs += (-170*e.s - 3.5*e.vs)*dt; e.s += e.vs*dt;
  }
}
function updateFace() {
  const a = fpos.array;
  for (const i of faceIdx) { const w = warp(fbase[i*3], fbase[i*3+1]); a[i*3] = fbase[i*3] + w[0]; a[i*3+1] = fbase[i*3+1] + w[1]; }

}

}

      const a = b + j*RS + k, c = b + j*RS + (k+1)%RS;
      idx.push(a, a + RS, c, c, a + RS, c + RS);
    }
  }
});
const mGeo = new THREE.BufferGeometry();
mGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3).setUsage(THREE.DynamicDrawUsage));
mGeo.setAttribute('normal', new THREE.BufferAttribute(mNor, 3).setUsage(THREE.DynamicDrawUsage));
mGeo.setAttribute('color', new THREE.BufferAttribute(mCol, 3));
mGeo.setIndex(idx);
const stache = new THREE.Mesh(mGeo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.33, metalness:0.08, side:THREE.DoubleSide}));
stache.castShadow = true; stache.receiveShadow = true; stache.frustumCulled = false;
scene.add(stache);

const P = new Float32Array(RP*3);
function updateMesh() {
  strands.forEach((st, si) => {
    const o = st.o*3;
    for (let j = 0; j < RP; j++) {
      const i = j >> 1;
      for (let c = 0; c < 3; c++) {
        if (!(j & 1)) { P[j*3+c] = pos[o + i*3 + c]; continue; }
        const p1 = pos[o + i*3 + c], p2 = pos[o + (i+1)*3 + c];
        const p0 = i > 0 ? pos[o + (i-1)*3 + c] : p1, p3 = i + 2 < NP ? pos[o + (i+2)*3 + c] : p2;
        P[j*3+c] = (-p0 + 9*p1 + 9*p2 - p3) / 16;
      }
    }
    let nx = 0, ny = 0, nz = 0;
    for (let j = 0; j < RP; j++) {
      const a = Math.max(0, j-1)*3, b = Math.min(RP-1, j+1)*3;
      let tx = P[b]-P[a], ty = P[b+1]-P[a+1], tz = P[b+2]-P[a+2];
      const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;
      if (j === 0) { nx = -ty; ny = tx; nz = 0; }
      const dt = nx*tx + ny*ty + nz*tz; nx -= tx*dt; ny -= ty*dt; nz -= tz*dt;
      const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
      const bx = ty*nz - tz*ny, by = tz*nx - tx*nz, bz = tx*ny - ty*nx;
      const u = j / (RP - 1);
      const r = st.thick * (1 - 0.72*Math.pow(u, 1.5)) * (j === 0 ? 0.7 : 1);
      for (let k = 0; k < RS; k++) {
        const ang = k / RS * Math.PI * 2, cs = Math.cos(ang), sn = Math.sin(ang);
        const ex = cs*nx + sn*bx, ey = cs*ny + sn*by, ez = cs*nz + sn*bz;
        const v = (si*VPS + j*RS + k)*3;
        mPos[v] = P[j*3] + ex*r; mPos[v+1] = P[j*3+1] + ey*r; mPos[v+2] = P[j*3+2] + ez*r;
        mNor[v] = ex; mNor[v+1] = ey; mNor[v+2] = ez;
      }
    }
  });
  mGeo.attributes.position.needsUpdate = true;
  mGeo.attributes.normal.needsUpdate = true;
}

// input
const ptr = {x:0, y:0, px:0, py:0, sx:0, sy:0, down:false, inside:false, nx:0, ny:0};
let grabbed = [];
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
const grabPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.03);
function toWorld(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ptr.nx = ndc.x; ptr.ny = ndc.y;
  camera.updateMatrixWorld(); ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(grabPlane, hit)) { ptr.x = hit.x; ptr.y = hit.y; }
}
const cv = renderer.domElement;
cv.addEventListener('pointermove', e => { toWorld(e); ptr.inside = true; });
cv.addEventListener('pointerleave', () => { ptr.inside = false; });
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); toWorld(e); ptr.px = ptr.x; ptr.py = ptr.y; ptr.down = true; ptr.inside = true;
  initAudio();
  heldEar = EARS.find(e => ((ptr.x - e.cx - e.ox)/0.085)**2 + ((ptr.y - e.cy - e.oy)/0.15)**2 < 1) || null;
  if (heldEar) { heldEar.held = true; heldEar.gx = ptr.x - heldEar.ox; heldEar.gy = ptr.y - heldEar.oy; cv.classList.add('grab'); squeak(); return; }
  const R = 0.095;
  grabbed = [];
  for (const st of strands) for (let i = 1; i < NP; i++) {
    const p = (st.o + i)*3, d = Math.hypot(pos[p] - ptr.x, pos[p+1] - ptr.y);
    if (d < R) grabbed.push({p, w: Math.pow(1 - d/R, 1.6), ox: pos[p] - ptr.x, oy: pos[p+1] - ptr.y});
  }
  if (grabbed.length) { cv.classList.add('grab'); squeak(); }
  else if (Math.abs(ptr.x - CX) < 0.3 && ptr.y > -0.4 && ptr.y < 0.35) tickle();
});
function release() {
  if (!ptr.down) return;
  ptr.down = false; cv.classList.remove('grab');
  if (grabbed.length) { boing(Math.min(1.5, Math.hypot(ptr.sx, ptr.sy) * 40 + 0.35)); }
  if (heldEar) { heldEar.held = false; heldEar.vs += 2.5; boing(Math.min(1.5, Math.hypot(heldEar.ox, heldEar.oy)*8 + 0.4)); heldEar = null; }
  grabbed = [];
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('dblclick', () => kick(1));
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); initAudio(); kick(1); } });

function kick(power) {
  for (const st of strands) for (let i = 2; i < NP; i++) {
    const p = (st.o + i)*3, u = i / (NP - 1);
    prev[p] -= st.sgn*rnd(0, 0.006)*u*power; prev[p+1] -= rnd(-0.01, 0.004)*u*power; prev[p+2] -= rnd(0, 0.008)*u*power;
  }
  earKick(power);
  boing(1.2*power);
}

// physics
const DAMP = 0.9955, GRAV = -1.1;
let wind = 0;
function step(dt, cdx, cdy) {
  const g = GRAV*dt*dt;
  const lift = 0.016*mood;
  const comb = !ptr.down && ptr.inside;
  for (const st of strands) {
    const w = warp(st.rx, st.ry);
    const rx = st.rx + w[0], ry = st.ry + w[1] + lift, rz = st.rz;
    const o = st.o*3;
    pos[o] = prev[o] = rx; pos[o+1] = prev[o+1] = ry; pos[o+2] = prev[o+2] = rz;
    for (let i = 1; i < NP; i++) {
      const p = o + i*3, u = i / (NP - 1);
      let x = pos[p], y = pos[p+1], z = pos[p+2];
      const vx = (x - prev[p])*DAMP, vy = (y - prev[p+1])*DAMP, vz = (z - prev[p+2])*DAMP;
      prev[p] = x; prev[p+1] = y; prev[p+2] = z;
      x += vx + wind*u*u*dt*dt; y += vy + g; z += vz;
      const phi = st.sgn*mood*(mood > 0 ? 1 : 0.45)*(0.08 + 0.38*u), c = Math.cos(phi), s = Math.sin(phi);
      const ox = restOff[p], oy = restOff[p+1] - (mood < 0 ? -mood*0.008*u : 0);
      const k = stiff[st.o + i];
      x += (rx + ox*c - oy*s - x)*k; y += (ry + ox*s + oy*c - y)*k; z += (rz + restOff[p+2] - z)*k;
      // combing
      if (comb) {
        const dx = x - ptr.x, dy = y - ptr.y, d2 = dx*dx + dy*dy;
        if (d2 < 0.0016) { const f = 1 - Math.sqrt(d2)/0.04; x += cdx*f*0.7; y += cdy*f*0.7; z += f*0.0012; }
      }
      pos[p] = x; pos[p+1] = y; pos[p+2] = z;
    }
  }
  for (const gb of grabbed) {
    const tx = ptr.x + gb.ox*0.85, ty = ptr.y + gb.oy*0.85, tz = 0.03 + 0.07*gb.w;
    const k = 0.25 + 0.6*gb.w;
    pos[gb.p] += (tx - pos[gb.p])*k; pos[gb.p+1] += (ty - pos[gb.p+1])*k; pos[gb.p+2] += (tz - pos[gb.p+2])*k*0.5;
  }
  for (let it = 0; it < 5; it++) for (const st of strands) {
    for (let i = 1; i < NP; i++) {
      const b = (st.o + i)*3, a = b - 3, L = restLen[st.o + i];
      const dx = pos[b]-pos[a], dy = pos[b+1]-pos[a+1], dz = pos[b+2]-pos[a+2];
      const d = Math.hypot(dx, dy, dz) || 1e-6, f = (d - L) / d;
      if (i === 1) { pos[b] -= dx*f; pos[b+1] -= dy*f; pos[b+2] -= dz*f; }
      else { const h = f*0.5; pos[a] += dx*h; pos[a+1] += dy*h; pos[a+2] += dz*h; pos[b] -= dx*h; pos[b+1] -= dy*h; pos[b+2] -= dz*h; }
      if (pos[b+2] < 0.005) { pos[b+2] = 0.005; prev[b] += (pos[b] - prev[b])*0.1; prev[b+1] += (pos[b+1] - prev[b+1])*0.1; }
    }
  }
}

// moods
const MOODS = {
  smile: {v: 1, label: 'ecstatic', q: ['Without music, life would be a mistake.', 'We should consider every day lost on which we have not danced at least once.', 'And those who were seen dancing were thought insane by those who could not hear the music.']},
  sad: {v: -1, label: 'devastated', q: ['God is dead. And we have killed him.', 'If you gaze long into an abyss, the abyss also gazes into you.', 'To live is to suffer.']},
  neutral: {v: 0, label: 'contemplative', q: ['He who has a why to live can bear almost any how.', 'That which does not kill us makes us stronger.', 'There are no facts, only interpretations.']},
  tickled: {v: 1.25, label: 'tickled', q: ['Hands off the Übermensch’s mustache!', 'hehe ok i mean: becoming is the only being.', 'Stop! The eternal recurrence of THIS?!']},
};
let curMood = 'neutral', moodTimer = 3;
const qEl = document.getElementById('quote'), qText = document.getElementById('qtext'), qMood = document.getElementById('mood');
function setMood(name, dur) {
  curMood = name; const m = MOODS[name];
  for (const e of EARS) e.vy += (m.v - moodTarget)*0.6;
  moodTarget = m.v; moodTimer = dur ?? rnd(2.8, 6);
  qMood.textContent = m.label; qText.textContent = m.q[Math.floor(Math.random()*m.q.length)];
  qEl.classList.add('pop'); setTimeout(() => qEl.classList.remove('pop'), 180);
}
function randomMood() {
  const opts = ['smile', 'sad', 'neutral', 'smile', 'sad'].filter(n => n !== curMood);
  setMood(opts[Math.floor(Math.random()*opts.length)]);
}
function tickle() { jiggle = 1; setMood('tickled', 3); giggle(); kick(0.35); }

// sounds
let ac = null, muted = false;
function initAudio() { if (!ac) { try { ac = new AudioContext(); } catch (e) { ac = null; } } else if (ac.state === 'suspended') ac.resume(); }
function tone(type, f0, f1, f2, dur, vol, vib) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur*0.15); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  if (vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = vib; lg.gain.value = f1*0.08; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur); }
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function boing(s) { const f = 120 + Math.random()*60 + mood*30; tone('sine', f*0.6, f*1.8*Math.min(s, 1.5), f, 0.55, 0.18*Math.min(1, s), 16); }
function squeak() { tone('triangle', 500, 900, 700, 0.09, 0.05); }
function giggle() { for (let i = 0; i < 5; i++) setTimeout(() => tone('triangle', 600 + i*60, 900 + i*80, 650, 0.09, 0.06), i*85); }
const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = 'sound: ' + (muted ? 'off' : 'on'); muteBtn.setAttribute('aria-pressed', muted); };


function resize() {
  const w = innerWidth, h = innerHeight, A = w / h;
  renderer.setSize(w, h); camera.aspect = A; camera.updateProjectionMatrix();
  const vh = A >= PW/PH ? PW / A : Math.max(PH, 0.62 / A), vw = vh*A;
  const clamp = (v, lo, hi) => lo > hi ? 0 : Math.min(hi, Math.max(lo, v));
  view.cx = clamp(CX, -PW/2 + vw/2, PW/2 - vw/2);
  view.cy = clamp(0.02, -PH/2 + vh/2, PH/2 - vh/2);
  view.d = (vh/2) / Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
}
addEventListener('resize', resize); resize();


const DT = 1/120;
let earTwitch = 2;
let acc = 0, last = performance.now(), camX = 0, camY = 0, gustT = 0;
function frame(now) {
  const fdt = Math.min(0.05, (now - last) / 1000); last = now; time += fdt;
  moodTimer -= fdt; if (moodTimer <= 0) randomMood();
  moodV += ((moodTarget - mood)*55 - moodV*7)*fdt; mood += moodV*fdt;
  jiggle *= Math.exp(-fdt*2.2);
  if ((earTwitch -= fdt) <= 0) { earTwitch = rnd(3, 8); const e = EARS[Math.random() < 0.5 ? 0 : 1]; e.vx += e.sgn*0.5; e.vs += 1.5; }
  for (let i = 0; i < 4; i++) updateEars(fdt/4);
  gustT -= fdt; if (gustT <= 0) { gustT = rnd(3, 8); wind = rnd(-1, 1)*0.9; }
  wind *= Math.exp(-fdt*1.5);

  const steps = Math.min(6, Math.floor((acc += fdt) / DT)); acc -= steps*DT; if (acc > DT) acc = 0;
  ptr.sx = (ptr.x - ptr.px) / Math.max(steps, 1); ptr.sy = (ptr.y - ptr.py) / Math.max(steps, 1);
  for (let i = 0; i < steps; i++) step(DT, ptr.sx, ptr.sy);
  ptr.px = ptr.x; ptr.py = ptr.y;

  updateFace(); updateMesh();
  const S = Math.max(mood, 0);
  blushMat.opacity = Math.min(0.55, S*0.5);
  for (const b of blush) { const w = warp(CX + b.userData.s*0.14, -0.03); b.position.set(CX + b.userData.s*0.14 + w[0], -0.03 + w[1], 0.002); }

  // tears
  if (mood < -0.45 && (tearTimer -= fdt) <= 0) {
    tearTimer = rnd(0.5, 1.3);
    const s = Math.random() < 0.5 ? -1 : 1, m = new THREE.Mesh(tearGeo, tearMat.clone());
    m.position.set(CX + s*EYE_DX + rnd(-0.01, 0.01), EYE_Y - 0.03, 0.012); m.userData = {vy: 0, vx: s*rnd(0.005, 0.02), life: 0};
    scene.add(m); tears.push(m);
  }
  for (let i = tears.length - 1; i >= 0; i--) {
    const m = tears[i], u = m.userData; u.life += fdt;
    const grow = Math.min(1, u.life*3);
    u.vy = Math.max(u.vy - fdt*0.35, -0.28);
    m.position.y += u.vy*fdt*grow; m.position.x += u.vx*fdt;
    m.scale.set(grow, grow*(1.1 + Math.min(0.8, -u.vy*3)), grow);
    m.material.opacity = 0.85*Math.min(1, (m.position.y + 0.42)*5);
    if (m.position.y < -0.42) { scene.remove(m); m.material.dispose(); tears.splice(i, 1); }
  }

  camX += (ptr.nx*0.05 - camX)*0.06; camY += (ptr.ny*0.035 - camY)*0.06;
  camera.position.set(view.cx + camX, view.cy + camY, view.d);
  camera.lookAt(view.cx, view.cy, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
